<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=NL2BP-Project-Highlight_en.html">
    <title>Redirecting... / 重定向中...</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        
        .message {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        a {
            color: #fff;
            text-decoration: none;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            display: inline-block;
            margin: 10px;
            transition: all 0.3s ease;
        }
        
        a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>Redirecting / 重定向中...</h1>
        <p>This page has been moved. You will be redirected automatically.<br>
        此页面已迁移，将自动跳转。</p>
        <div>
            <a href="NL2BP-Project-Highlight_en.html">English Version</a>
            <a href="NL2BP-Project-Highlight_zh.html">中文版本</a>
        </div>
    </div>
    
    <script>
        // Fallback redirect if meta refresh doesn't work
        setTimeout(() => {
            window.location.href = 'NL2BP-Project-Highlight_en.html';
        }, 100);
    </script>
</body>
</html>
